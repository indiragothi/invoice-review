[project]
name = "invoice-review-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "pillow==13.0.0",
    "pydantic==2.14.1",
    "pydantic-ai-slim[google,openai]==2.61.0",
    "pydantic-settings==2.16.1",
    "pymupdf==2.0",
    "python-multipart==0.0.32",
    "python-stdnum==2.2",
    "rapidocr-onnxruntime==1.4.4",
    "sqlalchemy==2.1.6",
    "uvicorn[standard]==0.54.0",
]

[tool.uv]
add-bounds = "exact"
exclude-newer = "7 days"
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "reportlab==5.1.0",
    "ruff==0.17.2",
]
